name: Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run security scans daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Dependency scanning
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Run npm audit
        run: |
          npm audit --audit-level moderate --json > audit-report.json || true

      - name: Parse audit results
        run: |
          if [[ -f audit-report.json ]]; then
            HIGH_VULN=$(jq '.metadata.vulnerabilities.high // 0' audit-report.json)
            CRITICAL_VULN=$(jq '.metadata.vulnerabilities.critical // 0' audit-report.json)

            echo "High vulnerabilities: $HIGH_VULN"
            echo "Critical vulnerabilities: $CRITICAL_VULN"

            if [[ $HIGH_VULN -gt 0 || $CRITICAL_VULN -gt 0 ]]; then
              echo "❌ High or critical vulnerabilities found!"
              npm audit --audit-level high
              exit 1
            else
              echo "✅ No high or critical vulnerabilities found"
            fi
          fi

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: audit-report.json
          retention-days: 30

  # Snyk security scan
  snyk-scan:
    name: Snyk Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'schedule' # Skip scheduled runs if no Snyk token

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: |
            --severity-threshold=high
            --json-file-output=snyk-report.json

      - name: Upload Snyk report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snyk-report
          path: snyk-report.json
          retention-days: 30

      - name: Monitor with Snyk
        if: github.ref == 'refs/heads/main'
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: monitor
          args: --project-name=ascendia

  # CodeQL analysis
  codeql-analysis:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['javascript']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{matrix.language}}"

  # Secret scanning
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for secret scanning

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: main
          head: HEAD
          extra_args: --debug --only-verified

      - name: Scan for hardcoded secrets
        run: |
          # Check for common secret patterns
          echo "Scanning for potential secrets..."

          # API keys
          if grep -r "api[_-]key\s*=\s*['\"][^'\"]\{20,\}" . --exclude-dir=node_modules --exclude-dir=.git; then
            echo "❌ Potential API key found"
            exit 1
          fi

          # Private keys
          if grep -r "BEGIN.*PRIVATE.*KEY" . --exclude-dir=node_modules --exclude-dir=.git; then
            echo "❌ Private key found"
            exit 1
          fi

          # Database URLs with credentials
          if grep -r "://.*:.*@" . --exclude-dir=node_modules --exclude-dir=.git --exclude="*.md"; then
            echo "❌ Potential database URL with credentials found"
            exit 1
          fi

          echo "✅ No obvious secrets found"

  # Docker security scan
  docker-scan:
    name: Docker Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          cat > Dockerfile << 'EOF'
          FROM node:20-alpine
          WORKDIR /app
          COPY package*.json ./
          RUN npm ci --only=production
          COPY . .
          RUN npm run build
          EXPOSE 3000
          CMD ["npm", "start"]
          EOF

          docker build -t ascendia:security-scan .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ascendia:security-scan'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # License compliance check
  license-check:
    name: License Compliance
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install license checker
        run: npm install -g license-checker

      - name: Check licenses
        run: |
          # Generate license report
          license-checker --json --out licenses.json

          # Check for problematic licenses
          PROBLEMATIC_LICENSES=("GPL" "AGPL" "LGPL" "MPL" "EPL" "CPAL")

          for license in "${PROBLEMATIC_LICENSES[@]}"; do
            if grep -i "$license" licenses.json; then
              echo "❌ Problematic license found: $license"
              exit 1
            fi
          done

          echo "✅ All licenses are compatible"

      - name: Upload license report
        uses: actions/upload-artifact@v4
        with:
          name: license-report
          path: licenses.json
          retention-days: 30

  # OWASP security scan
  owasp-scan:
    name: OWASP Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Start application
        run: |
          npm start &
          sleep 30 # Wait for app to start
        env:
          PORT: 3000

      - name: Run OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.10.0
        with:
          target: 'http://localhost:3000'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'

      - name: Upload OWASP ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-zap-report
          path: report_html.html
          retention-days: 30

  # Security summary and notification
  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [dependency-scan, snyk-scan, codeql-analysis, secret-scan, license-check]
    if: always()

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: security-reports/

      - name: Generate security summary
        run: |
          echo "## Security Scan Summary 🔒" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Scan Type | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| Dependency Scan | ${{ needs.dependency-scan.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Snyk Scan | ${{ needs.snyk-scan.result == 'success' && '✅ Passed' || needs.snyk-scan.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| CodeQL Analysis | ${{ needs.codeql-analysis.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Secret Scan | ${{ needs.secret-scan.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| License Check | ${{ needs.license-check.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Check for any failures
          FAILED_SCANS=""
          if [[ "${{ needs.dependency-scan.result }}" != "success" ]]; then
            FAILED_SCANS="$FAILED_SCANS dependency-scan"
          fi
          if [[ "${{ needs.snyk-scan.result }}" == "failure" ]]; then
            FAILED_SCANS="$FAILED_SCANS snyk-scan"
          fi
          if [[ "${{ needs.codeql-analysis.result }}" != "success" ]]; then
            FAILED_SCANS="$FAILED_SCANS codeql-analysis"
          fi
          if [[ "${{ needs.secret-scan.result }}" != "success" ]]; then
            FAILED_SCANS="$FAILED_SCANS secret-scan"
          fi
          if [[ "${{ needs.license-check.result }}" != "success" ]]; then
            FAILED_SCANS="$FAILED_SCANS license-check"
          fi

          if [[ -n "$FAILED_SCANS" ]]; then
            echo "**⚠️ Security Issues Detected**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Failed scans: $FAILED_SCANS" >> $GITHUB_STEP_SUMMARY
            echo "Please review the security reports and address any issues before deployment." >> $GITHUB_STEP_SUMMARY
          else
            echo "**✅ All Security Scans Passed**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "No security issues detected." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Notify on critical security issues
        if: needs.dependency-scan.result == 'failure' || needs.secret-scan.result == 'failure'
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_CHANNEL: 'security'
          SLACK_COLOR: danger
          SLACK_MESSAGE: |
            🚨 Critical security issues detected in ${{ github.repository }}!

            **Branch:** ${{ github.ref_name }}
            **Commit:** ${{ github.sha }}
            **Failed Scans:** ${{ needs.dependency-scan.result == 'failure' && 'Dependency Scan ' || '' }}${{ needs.secret-scan.result == 'failure' && 'Secret Scan' || '' }}

            Please review immediately: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
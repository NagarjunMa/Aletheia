name: Deploy to Production

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
      force_deploy:
        description: 'Force deployment even if tests fail'
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-${{ github.ref }}-${{ inputs.environment || 'production' }}
  cancel-in-progress: false

env:
  NODE_VERSION: '20'
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  # Pre-deployment checks
  pre-deployment:
    name: Pre-deployment Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      should-deploy: ${{ steps.checks.outputs.should-deploy }}
      environment: ${{ steps.environment.outputs.environment }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine environment
        id: environment
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "environment=${{ inputs.environment }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "environment=production" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "environment=production" >> $GITHUB_OUTPUT
          else
            echo "environment=staging" >> $GITHUB_OUTPUT
          fi

      - name: Generate version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "version=${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Run pre-deployment checks
        id: checks
        run: |
          # Type check
          npm run type-check

          # Quick lint
          npm run lint

          # Quick test suite (if not forced)
          if [[ "${{ inputs.force_deploy }}" != "true" ]]; then
            npm run test -- --run --reporter=basic
          fi

          echo "should-deploy=true" >> $GITHUB_OUTPUT

  # Build and test
  build:
    name: Build Application
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: pre-deployment
    if: needs.pre-deployment.outputs.should-deploy == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1
          # Environment-specific variables
          NEXT_PUBLIC_SUPABASE_URL: ${{
            needs.pre-deployment.outputs.environment == 'production'
            && secrets.PROD_SUPABASE_URL
            || secrets.STAGING_SUPABASE_URL
          }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{
            needs.pre-deployment.outputs.environment == 'production'
            && secrets.PROD_SUPABASE_ANON_KEY
            || secrets.STAGING_SUPABASE_ANON_KEY
          }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-files
          path: |
            .next/
            public/
            package.json
            next.config.js
          retention-days: 1

      - name: Generate build report
        run: |
          echo "## Build Report 🏗️" >> build-report.md
          echo "" >> build-report.md
          echo "**Environment:** ${{ needs.pre-deployment.outputs.environment }}" >> build-report.md
          echo "**Version:** ${{ needs.pre-deployment.outputs.version }}" >> build-report.md
          echo "**Commit:** ${{ github.sha }}" >> build-report.md
          echo "" >> build-report.md
          echo "### Bundle Size" >> build-report.md
          echo '```' >> build-report.md
          du -sh .next/ >> build-report.md
          echo '```' >> build-report.md

      - name: Upload build report
        uses: actions/upload-artifact@v4
        with:
          name: build-report
          path: build-report.md
          retention-days: 7

  # Deploy to Vercel
  deploy-vercel:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [pre-deployment, build]
    environment: ${{ needs.pre-deployment.outputs.environment }}

    outputs:
      deployment-url: ${{ steps.deploy.outputs.deployment-url }}
      preview-url: ${{ steps.deploy.outputs.preview-url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-files
          path: .

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment information
        run: |
          vercel pull --yes --environment=${{ needs.pre-deployment.outputs.environment }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build project artifacts
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        id: deploy
        run: |
          if [[ "${{ needs.pre-deployment.outputs.environment }}" == "production" ]]; then
            DEPLOYMENT_URL=$(vercel --prod --token=${{ secrets.VERCEL_TOKEN }})
          else
            DEPLOYMENT_URL=$(vercel --token=${{ secrets.VERCEL_TOKEN }})
          fi

          echo "deployment-url=$DEPLOYMENT_URL" >> $GITHUB_OUTPUT

          # Get preview URL for non-production deployments
          if [[ "${{ needs.pre-deployment.outputs.environment }}" != "production" ]]; then
            echo "preview-url=$DEPLOYMENT_URL" >> $GITHUB_OUTPUT
          fi

      - name: Comment deployment URL on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: deployment
          recreate: true
          message: |
            ## Deployment 🚀

            **Environment:** ${{ needs.pre-deployment.outputs.environment }}
            **Status:** ✅ Deployed successfully
            **URL:** ${{ steps.deploy.outputs.deployment-url }}

            [Visit deployment](${{ steps.deploy.outputs.deployment-url }})

  # Post-deployment verification
  post-deployment:
    name: Post-deployment Verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [pre-deployment, deploy-vercel]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Wait for deployment
        run: |
          echo "Waiting for deployment to be ready..."
          for i in {1..30}; do
            if curl -sf "${{ needs.deploy-vercel.outputs.deployment-url }}" > /dev/null; then
              echo "Deployment is ready!"
              break
            fi
            echo "Attempt $i: Deployment not ready yet, waiting..."
            sleep 10
          done

      - name: Run smoke tests
        run: |
          npx playwright test --grep="@smoke" --project=chromium
        env:
          PLAYWRIGHT_BASE_URL: ${{ needs.deploy-vercel.outputs.deployment-url }}
          CI: true

      - name: Run health checks
        run: |
          # Basic health check
          curl -f "${{ needs.deploy-vercel.outputs.deployment-url }}/api/health" || exit 1

          # Check if main pages load
          curl -f "${{ needs.deploy-vercel.outputs.deployment-url }}/" || exit 1

          echo "All health checks passed!"

      - name: Run Lighthouse audit
        if: needs.pre-deployment.outputs.environment == 'production'
        run: |
          npm install -g @lhci/cli@0.12.x
          lhci autorun --upload.target=temporary-public-storage
        env:
          LHCI_BUILD_CONTEXT__CURRENT_HASH: ${{ github.sha }}
          LHCI_BUILD_CONTEXT__COMMIT_TIME: ${{ github.event.head_commit.timestamp }}
          LHCI_BUILD_CONTEXT__CURRENT_BRANCH: ${{ github.ref_name }}
          LHCI_BUILD_CONTEXT__COMMIT_MESSAGE: ${{ github.event.head_commit.message }}

      - name: Upload verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-results
          path: |
            test-results/
            lighthouse-report.html
          retention-days: 7

  # Database migrations (if needed)
  migrate-database:
    name: Run Database Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [pre-deployment, deploy-vercel]
    if: needs.pre-deployment.outputs.environment == 'production'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Supabase CLI
        run: |
          curl -fsSL https://supabase.com/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Run database migrations
        run: |
          # Run any pending migrations
          supabase db push --db-url "${{ secrets.PROD_DATABASE_URL }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  # Notification and reporting
  notify:
    name: Deployment Notification
    runs-on: ubuntu-latest
    needs: [pre-deployment, deploy-vercel, post-deployment]
    if: always()

    steps:
      - name: Determine deployment status
        id: status
        run: |
          if [[ "${{ needs.deploy-vercel.result }}" == "success" && "${{ needs.post-deployment.result }}" == "success" ]]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "emoji=🚀" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "emoji=❌" >> $GITHUB_OUTPUT
          fi

      - name: Create deployment summary
        run: |
          echo "## Deployment Summary ${{ steps.status.outputs.emoji }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ needs.pre-deployment.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ needs.pre-deployment.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ steps.status.outputs.status }}" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** ${{ needs.deploy-vercel.outputs.deployment-url }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Job Results" >> $GITHUB_STEP_SUMMARY
          echo "- Pre-deployment: ${{ needs.pre-deployment.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Build: ${{ needs.build.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Deploy: ${{ needs.deploy-vercel.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Verification: ${{ needs.post-deployment.result }}" >> $GITHUB_STEP_SUMMARY

      - name: Notify Slack (on failure)
        if: failure() && needs.pre-deployment.outputs.environment == 'production'
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_CHANNEL: 'deployments'
          SLACK_COLOR: danger
          SLACK_MESSAGE: |
            🚨 Production deployment failed!

            **Repository:** ${{ github.repository }}
            **Branch:** ${{ github.ref_name }}
            **Commit:** ${{ github.sha }}
            **Workflow:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Notify Slack (on success)
        if: success() && needs.pre-deployment.outputs.environment == 'production'
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_CHANNEL: 'deployments'
          SLACK_COLOR: good
          SLACK_MESSAGE: |
            🚀 Production deployment successful!

            **Repository:** ${{ github.repository }}
            **Version:** ${{ needs.pre-deployment.outputs.version }}
            **URL:** ${{ needs.deploy-vercel.outputs.deployment-url }}

  # Rollback mechanism (manual trigger)
  rollback:
    name: Rollback Deployment
    runs-on: ubuntu-latest
    if: failure() && needs.pre-deployment.outputs.environment == 'production'
    needs: [pre-deployment, deploy-vercel, post-deployment]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Rollback to previous deployment
        run: |
          # Get the previous successful deployment
          PREVIOUS_DEPLOYMENT=$(vercel list --token=${{ secrets.VERCEL_TOKEN }} | grep "READY" | head -2 | tail -1 | awk '{print $1}')

          if [[ -n "$PREVIOUS_DEPLOYMENT" ]]; then
            echo "Rolling back to deployment: $PREVIOUS_DEPLOYMENT"
            vercel alias set "$PREVIOUS_DEPLOYMENT" --token=${{ secrets.VERCEL_TOKEN }}
          else
            echo "No previous deployment found for rollback"
            exit 1
          fi

      - name: Notify rollback
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_CHANNEL: 'deployments'
          SLACK_COLOR: warning
          SLACK_MESSAGE: |
            ⚠️ Production deployment rolled back due to failure!

            **Repository:** ${{ github.repository }}
            **Failed Commit:** ${{ github.sha }}
            **Workflow:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
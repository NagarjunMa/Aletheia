name: CD

# Runs on every push to main (i.e. after a PR is merged).
# Gate: quality checks + mocked E2E (no real APIs).
# On success: fast-forward the staging branch → Vercel staging auto-deploys via webhook.
# staging.yml then fires via workflow_run to run real E2E and promote to production.

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test -- --run

      - name: Guardrail tests
        run: npm run test:guardrails -- --run

  e2e-mocked:
    name: E2E Smoke (Mocked — Local Server)
    needs: quality
    runs-on: ubuntu-latest
    env:
      # Dummy values — @smoke tests only hit /api/health and page routes.
      # They do not call Supabase or Anthropic.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: placeholder-service-key
      ANTHROPIC_API_KEY: placeholder-api-key
      NEXT_PUBLIC_APP_ENV: dev
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run smoke E2E tests
        run: npx playwright test --project=chromium --grep "@smoke"
        env:
          CI: true

  promote-to-staging:
    name: Promote → Staging
    needs: e2e-mocked
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fast-forward staging to main
        run: |
          git fetch origin
          git checkout staging
          git merge origin/main --ff-only
          git push origin staging
        # GITHUB_TOKEN push → Vercel staging deploys via GitHub webhook.
        # This push intentionally does NOT trigger staging.yml
        # (GITHUB_TOKEN pushes never trigger other workflows).
        # staging.yml fires separately via workflow_run on this workflow's completion.

name: CI

on:
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.x"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            ascendia-extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.x"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            ascendia-extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage gate
        run: npm run test:coverage -- --run

      - name: Run guardrail tests
        run: npm run test:guardrails -- --run

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  extension-security:
    name: Extension Security & Build
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.x"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            ascendia-extension/package-lock.json

      - name: Install extension dependencies
        run: npm ci --prefix ascendia-extension

      - name: Audit extension dependencies
        run: npm --prefix ascendia-extension run security:audit

      - name: Type check extension
        run: npm --prefix ascendia-extension run type-check

      - name: Lint extension
        run: npm --prefix ascendia-extension run lint

      - name: Test extension
        run: npm --prefix ascendia-extension test

      - name: Build extension
        run: npm --prefix ascendia-extension run build:ext

  smoke-test:
    name: Smoke Test & Health Check
    runs-on: ubuntu-latest
    needs: [test, extension-security]
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.x"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            ascendia-extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key-for-build-only
          NEXT_PUBLIC_APP_ENV: dev
        run: npm run build

      - name: Start Server & Check Health
        run: |
          # Start the server in the background
          npm run start &
          SERVER_PID=$!

          # Wait for the server to be ready (max 30 seconds)
          echo "Waiting for server to start..."
          timeout 30 bash -c 'until curl -s http://localhost:3000/api/health > /dev/null; do sleep 2; done'

          # Check health endpoint using curl
          echo "Testing health endpoint..."
          curl -f http://localhost:3000/api/health || exit 1

          # Kill server
          kill $SERVER_PID

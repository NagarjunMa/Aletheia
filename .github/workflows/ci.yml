name: CI

on:
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test -- --run

      - name: Run guardrail tests
        run: npm run test:guardrails -- --run

  smoke-test:
    name: Smoke Test & Health Check
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key-for-build-only
          NEXT_PUBLIC_APP_ENV: dev
        run: npm run build

      - name: Start Server & Check Health
        run: |
          # Start the server in the background
          npm run start &
          SERVER_PID=$!
          
          # Wait for the server to be ready (max 30 seconds)
          echo "Waiting for server to start..."
          timeout 30 bash -c 'until curl -s http://localhost:3000/api/health > /dev/null; do sleep 2; done'
          
          # Check health endpoint using curl
          echo "Testing health endpoint..."
          curl -f http://localhost:3000/api/health || exit 1
          
          # Kill server
          kill $SERVER_PID

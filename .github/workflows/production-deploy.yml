name: Production deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Migrate Supabase, then deploy Vercel
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check out the production commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.x"

      - name: Validate release credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing production configuration: $name" >&2
              exit 1
            fi
          done

      - name: Install pinned deployment CLIs
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.119.0

      - name: Install Vercel CLI
        run: npm install --global vercel@63.1.2

      - name: Verify Vercel production target
        shell: bash
        run: |
          set -euo pipefail
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          node scripts/production-deploy-checks.mjs target .vercel/.env.production.local "$SUPABASE_PROJECT_ID"

      - name: Connect to production Supabase and validate migration history
        shell: bash
        run: |
          set -euo pipefail
          supabase link --project-ref "$SUPABASE_PROJECT_ID"
          supabase migration list --linked > "$RUNNER_TEMP/migrations-before.txt"
          node scripts/production-deploy-checks.mjs history pre < "$RUNNER_TEMP/migrations-before.txt"
          supabase db push --linked --skip-vault --dry-run

      - name: Apply pending production migrations
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --linked --skip-vault --yes
          supabase migration list --linked > "$RUNNER_TEMP/migrations-after.txt"
          node scripts/production-deploy-checks.mjs history post < "$RUNNER_TEMP/migrations-after.txt"
          supabase db query --linked \
            "SELECT fact_review FROM public.candidate_evidence LIMIT 0;" > /dev/null
          node scripts/production-deploy-checks.mjs app-connection \
            .vercel/.env.production.local "$SUPABASE_PROJECT_ID"

      - name: Stage the matching Vercel production build
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          deployment_url="$(vercel deploy --prod --skip-domain --yes --token="$VERCEL_TOKEN")"
          if [[ ! "$deployment_url" =~ ^https://[a-zA-Z0-9.-]+\.vercel\.app/?$ ]]; then
            echo "Vercel did not return a production deployment URL" >&2
            exit 1
          fi
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Verify staged deployment
        shell: bash
        run: |
          set -euo pipefail
          vercel curl /api/health --deployment "${{ steps.stage.outputs.url }}" \
            --fail --silent --show-error --max-time 30 --token="$VERCEL_TOKEN" \
            > "$RUNNER_TEMP/staged-health.json"
          node scripts/production-deploy-checks.mjs health "$SUPABASE_PROJECT_ID" \
            < "$RUNNER_TEMP/staged-health.json"

      - name: Promote staged deployment to production
        shell: bash
        run: |
          set -euo pipefail
          vercel promote "${{ steps.stage.outputs.url }}" --yes --token="$VERCEL_TOKEN"
          echo "Production deployment: ${{ steps.stage.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

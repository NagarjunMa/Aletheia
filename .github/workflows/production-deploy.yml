name: Production database migrations

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-database-migrations
  cancel-in-progress: false
  queue: max

jobs:
  migrate:
    name: Supabase migration gate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
    steps:
      - name: Check out the production commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.x"

      - name: Validate production database configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing production configuration: $name" >&2
              exit 1
            fi
          done
          node scripts/production-deploy-checks.mjs project-ref "$SUPABASE_PROJECT_ID"

      - name: Verify live app uses the same Supabase project
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 15 \
            --proto '=https' --max-redirs 0 \
            https://www.aletheia.live/api/health \
            | node scripts/production-deploy-checks.mjs production-target "$SUPABASE_PROJECT_ID"

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.119.0

      - name: Connect and detect pending migrations
        shell: bash
        run: |
          set -euo pipefail
          supabase link --project-ref "$SUPABASE_PROJECT_ID"
          supabase migration list --linked > "$RUNNER_TEMP/migrations-before.txt"
          node scripts/production-deploy-checks.mjs history pre < "$RUNNER_TEMP/migrations-before.txt"
          supabase db push --linked --skip-vault --dry-run

      - name: Apply pending migrations and verify production schema
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --linked --skip-vault --yes
          supabase migration list --linked > "$RUNNER_TEMP/migrations-after.txt"
          node scripts/production-deploy-checks.mjs history post < "$RUNNER_TEMP/migrations-after.txt"
          supabase db query --linked \
            "SELECT fact_review FROM public.candidate_evidence LIMIT 0;" > /dev/null
          echo "Production Supabase migrations verified for commit $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

name: Resume Production Gate

on:
  workflow_dispatch:
    inputs:
      confirm_isolated_project:
        description: Type "yes" after verifying the protected environment targets only the isolated test project
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: resume-production-gate
  cancel-in-progress: false

jobs:
  production-like-integration:
    name: Isolated direct-upload integration
    runs-on: ubuntu-latest
    environment: resume-production-gate
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run isolated resume production gate
        run: npm run test:resume-production
        env:
          RESUME_GATE_ENABLED: "true"
          RESUME_GATE_CONFIRM_ISOLATED_PROJECT: ${{ inputs.confirm_isolated_project }}
          RESUME_GATE_EXPECTED_COMMIT_SHA: ${{ github.sha }}
          RESUME_GATE_BASE_URL: ${{ vars.RESUME_GATE_BASE_URL }}
          RESUME_GATE_PRODUCTION_BASE_URL: ${{ vars.RESUME_GATE_PRODUCTION_BASE_URL }}
          PLAYWRIGHT_BASE_URL: ${{ vars.RESUME_GATE_BASE_URL }}
          RESUME_GATE_VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.RESUME_GATE_VERCEL_AUTOMATION_BYPASS_SECRET }}
          RESUME_GATE_SUPABASE_URL: ${{ secrets.RESUME_GATE_SUPABASE_URL }}
          RESUME_GATE_PRODUCTION_SUPABASE_URL: ${{ secrets.RESUME_GATE_PRODUCTION_SUPABASE_URL }}
          RESUME_GATE_SUPABASE_ANON_KEY: ${{ secrets.RESUME_GATE_SUPABASE_ANON_KEY }}
          RESUME_GATE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.RESUME_GATE_SUPABASE_SERVICE_ROLE_KEY }}
          RESUME_GATE_USER_A_EMAIL: ${{ secrets.RESUME_GATE_USER_A_EMAIL }}
          RESUME_GATE_USER_A_PASSWORD: ${{ secrets.RESUME_GATE_USER_A_PASSWORD }}
          RESUME_GATE_USER_B_EMAIL: ${{ secrets.RESUME_GATE_USER_B_EMAIL }}
          RESUME_GATE_USER_B_PASSWORD: ${{ secrets.RESUME_GATE_USER_B_PASSWORD }}
          RESUME_GATE_CRON_SECRET: ${{ secrets.RESUME_GATE_CRON_SECRET }}

      - name: Upload production-gate evidence
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: resume-production-gate-evidence
          path: test-results/**/resume-*-byte-result.json
          if-no-files-found: error
          retention-days: 14
